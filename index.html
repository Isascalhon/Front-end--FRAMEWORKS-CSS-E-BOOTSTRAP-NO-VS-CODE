<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoEscola Do Tião</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="bg-dark text-white">
    <h1 class="text-white text-center m-5">AutoEscola Do Tião</h1>
    <div class="container mt-4">
        <div class="p-4 bg-danger text-white rounded shadow">
            <h2>Carta A</h2>
            <p class="mp-3">Licença para condução de motos</p>
            <button class="btn btn-light shadow rounded">conhecer serviços</button>
        </div>
    </div>
    <div class="container mt-4">
        <div class="p-4 bg-warning text-white rounded shadow">
            <h2>Carta B</h2>
            <p class="mp-3">Licença para condução de carros</p>
            <button class="btn btn-light shadow rounded">conhecer serviços</button>
        </div>
    </div>
     <div class="container mt-4">
        <div class="p-4 bg-success text-white rounded shadow">
            <h2>Carta C</h2>
            <p class="mp-3">Licença para condução de veículos de carga</p>
            <button class="btn btn-light shadow rounded">conhecer serviços</button>
        </div>
    </div>
    
        
</body>

</html>
